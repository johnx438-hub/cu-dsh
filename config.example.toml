# cu-dsh configuration template (M2: machine/user bindings).
# Copy to ~/.config/cu-dsh/config.toml (or set CU_CONFIG=/path/to/config.toml).
# Every value here is optional — omitted keys fall back to sane defaults.
# Environment variables (CU_<SECTION>_<KEY>, e.g. CU_WSL_CHECKOUT) always
# override the file.

[machine]
# Machine names allowed to run `cu-dsh mcp`. Empty/missing = no check
# (any host may serve). Set it to lock the MCP face to specific machines.
allowlist = ["ARCHER", "other-box"]

[tailscale]
# Optional tailscale hostname admitted to the MCP transport allowlist
# (allowed_hosts / allowed_origins). Omit when not serving over tailscale.
host = "archer.tailca07d9.ts.net"

[wsl]
# Minimal-agent-ts checkout path AS SEEN FROM WSL (the vision bridge and the
# inbox MCP bridge run inside WSL; the sessions log is read via UNC from it).
checkout = "/home/archer/zerostack-analysis/minimal-agent-ts"
# Node bin dir used to launch `npx tsx scripts/dsh-inbox-mcp.ts` in WSL
# (wsl.exe interop can otherwise resolve the Windows node and break npx).
nvm_bin = "/home/archer/.nvm/versions/node/v24.14.1/bin"
# DSH session store path relative to the checkout, used to poll the vision
# minion's reply.
sessions_rel = "docs/research/dsh-spike/.dsh-home/sessions/--home-archer-zerostack-analysis-minimal-agent-ts-docs-research-dsh-cu-perceive--"

[vision]
# describe() backend: "lmstudio" (default — wake a local multimodal DSH
# minion via the inbox bridge) or "openai" (any OpenAI-compatible vision
# API; no local model needed).
backend = "lmstudio"

# --- only for backend = "openai" ----------------------------------------
# qwen (Alibaba DashScope, OpenAI-compatible mode):
#   base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
#   model = "qwen-vl-max"          # or qwen-vl-plus
#   api_key_env = "DASHSCOPE_API_KEY"
# doubao (Volcengine Ark, OpenAI-compatible):
#   base_url = "https://ark.cn-beijing.volces.com/api/v3"
#   model = "doubao-1-5-vision-pro-32k-250115"   # your endpoint/model id
#   api_key_env = "ARK_API_KEY"
# kimi (Moonshot):
#   base_url = "https://api.moonshot.cn/v1"
#   model = "moonshot-v1-8k-vision-preview"
#   api_key_env = "MOONSHOT_API_KEY"
# base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
# model = "qwen-vl-max"
